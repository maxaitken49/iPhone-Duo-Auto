name: Duo stock watch
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: seen.json
          key: seen-${{ github.run_id }}
          restore-keys: seen-
      - run: python duo_watch.py --once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          BESTBUY_KEY: ${{ secrets.BESTBUY_KEY }}
